# GitHub Actions dependency updates (OpenSSF dependency_monitoring).
#
# Swift and Bun are not listed yet: Dependabot's Swift (6.3) cannot read ThawUI's
# tools-version 6.4 manifest, and its Bun cannot read bun.lock's lockfileVersion 2.
# dependency-sca.yml scans both lockfiles with OSV in the meantime.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    assignees:
      - "diazdesandi"
    groups:
      github-actions:
        patterns:
          - "*"

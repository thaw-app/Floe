name: "PR Metadata"

# Labels and shape checks via pull_request_target, never checking out PR code.
# Bot PRs skip by login, never title; no `edited` runs.
# The area labels below are the ones the pull request template lists.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: thaw-app/org-ci/actions/pr-metadata@61f345397193bf3f9356c4f6179fb6ed4c84dd45
        with:
          comment-marker: "<!-- floe-pr-conventions -->"
          title-example-scope: runtime
          area-rules: |
            [
              {"label": "runtime", "prefixes": ["runtime/"]},
              {"label": "extensions", "prefixes": ["extensions/"]},
              {"label": "vendor", "prefixes": ["Vendor/"]},
              {"label": "app", "prefixes": ["Sources/", "Resources/", "Floe.xcodeproj/"], "paths": ["project.yml", "Package.swift", "Package.resolved"]},
              {"label": "ops", "kind": "ops", "prefixes": [".github/", "scripts/", "docs/"], "paths": ["README.md", ".sonarcloud.properties"]}
            ]

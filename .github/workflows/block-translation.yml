name: "Block Translation (PRs)"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.xcstrings"

permissions:
  contents: read

jobs:
  block-manual-translations:
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: thaw-app/org-ci/actions/block-translation-prs@a5d047fe853b328067a3423f40d404b4b8245653
        with:
          product: Floe
          crowdin-url: https://crowdin.com/project/floe

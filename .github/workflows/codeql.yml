name: CodeQL

on:
  schedule:
    # Weekly, offset from the hour to avoid GitHub's cron pileup.
    - cron: "31 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Swift is left out. CodeQL traces Swift builds under Rosetta, which Thaw
  # works around by building with Xcode 26 on macOS 26, and Vendor/ThawUI
  # needs the Swift 6.4 tools that ship with Xcode 27. SonarQube Cloud
  # covers the Swift sources in the meantime.
  analyze:
    if: github.repository == 'thaw-app/Floe'
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

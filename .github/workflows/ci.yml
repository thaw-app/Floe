name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# Runs on every PR and push to main so Scorecard sees checks; the macOS work
# stays gated on path detection below.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-slim
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code-related paths
        id: filter
        uses: thaw-app/org-ci/actions/detect-code-changes@cfa52194f39013d6f54e6f5a14dc57cec3a20e9b
        with:
          patterns: '(\.swift$|(^|/)Package\.resolved$|^Floe\.xcodeproj/|^project\.yml$|^Resources/|^Vendor/|^runtime/|^extensions/|^scripts/|^sonar-project\.properties$|^\.swiftlint|^\.swiftformat$|^\.github/workflows/ci\.yml$)'

  lint:
    needs: changes
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-latest
    steps:
      - name: Skip lint (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed; skipping SwiftLint."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Run SwiftLint
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057 \
            swiftlint --strict

  # Vendor/ThawUI declares swift-tools-version 6.4, so the build needs Xcode 27;
  # there is no Xcode 26 job as in Thaw.
  build:
    if: github.repository == 'thaw-app/Floe'
    # GitHub-hosted Xcode 27 preview image (arm64).
    runs-on: xcode-27
    needs: changes
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Skip macOS build (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed; skipping the build and checks."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      # Installs to ~/.bun/bin/bun, one of the places the Embed Runtime build
      # phase looks for the Bun it copies into the app.
      - name: Install Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      # The Embed Runtime build phase fails without runtime/node_modules.
      - name: Install runtime dependencies
        if: needs.changes.outputs.code == 'true'
        working-directory: runtime
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Runtime smoke test
        if: needs.changes.outputs.code == 'true'
        run: bun runtime/smoke.ts extensions/hello planets

      - name: Cache SwiftPM
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # The calculator's engine and the file index are Rust, built into Vendor/FloeRust/Frameworks, which is not committed.
      # The FloeRust package does not resolve without it, so this comes before any Swift build.
      # Kept between runs until the wrapper, its lock file or its compiler changes.
      - name: Cache FloeRust
        id: rust-cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/FloeRust/Frameworks
          key: floe-rust-${{ runner.os }}-${{ hashFiles('Vendor/FloeRust/rust/Cargo.lock', 'Vendor/FloeRust/rust/Cargo.toml', 'Vendor/FloeRust/rust/rust-toolchain.toml', 'Vendor/FloeRust/rust/src/**', 'Vendor/FloeRust/include/**', 'scripts/build-rust.sh') }}

      - name: Build FloeRust
        if: needs.changes.outputs.code == 'true' && steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ./scripts/build-rust.sh
          (cd Vendor/FloeRust/rust && cargo test)

      # No test target yet, so this builds only. The selftest below is the
      # end-to-end check.
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Floe.xcodeproj \
            -scheme Floe \
            -configuration Debug \
            -derivedDataPath Build/ \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Swift to Bun round trip against the checkout's extensions/. A failed
      # command still exits 0, so the output is checked as well.
      - name: Selftest
        if: needs.changes.outputs.code == 'true'
        env:
          FLOE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          output="$(Build/Build/Products/Debug/Floe.app/Contents/MacOS/Floe --selftest hello planets)"
          echo "$output"
          grep -q '^SELFTEST OK' <<<"$output"

      # The launcher drawn off screen with searches typed into it. About 50 MB in a debug build.
      - name: Memory budget
        if: needs.changes.outputs.code == 'true'
        run: |
          ./scripts/check-budget.sh Build/Build/Products/Debug/Floe.app/Contents/MacOS/Floe 100
          python3 scripts/check-resident-budget.py ci 150

      - name: Signing script tests
        if: needs.changes.outputs.code == 'true'
        run: python3 -B -m unittest discover -s scripts/tests -v

      # Swift Testing and bun test, with the coverage reports the Sonar job reads.
      - name: Tests with coverage
        if: needs.changes.outputs.code == 'true'
        run: ./scripts/coverage.sh --summary

      - name: Upload coverage
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: |
            coverage/swift.xml
            coverage/runtime/lcov.info
          retention-days: 3

  sonarqube:
    needs: [changes, build]
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-latest
    env:
      # Forks and Dependabot get no SONAR_TOKEN on pull_request.
      SONAR_ENABLED: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Skip SonarQube for fork / Dependabot PRs
        if: env.SONAR_ENABLED != 'true'
        run: |
          echo "Skipping SonarQube analysis (fork or Dependabot PR; no SONAR_TOKEN access)"
          echo "Analysis will be performed after merge to the default branch"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_ENABLED == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Uses this run's coverage, or the last cached reports when the build was
      # skipped. With neither, it leaves the last analysis alone.
      - name: Scan with coverage
        if: env.SONAR_ENABLED == 'true'
        uses: thaw-app/org-ci/actions/sonar-scan@cfa52194f39013d6f54e6f5a14dc57cec3a20e9b
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          code-changed: ${{ needs.changes.outputs.code }}
          artifact-path: coverage
          cache-path: coverage
          reports: |
            sonar.coverageReportPaths=coverage/swift.xml
            sonar.javascript.lcov.reportPaths=coverage/runtime/lcov.info

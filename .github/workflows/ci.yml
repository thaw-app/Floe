name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# Runs on every PR and push to main so Scorecard sees checks; the macOS work
# stays gated on path detection below.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-slim
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code-related paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "No usable before SHA; treating as code change."
              exit 0
            fi
            range="${before}...${{ github.sha }}"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: treating as code change."
            exit 0
          fi

          patterns='(\.swift$|(^|/)Package\.resolved$|^Floe\.xcodeproj/|^project\.yml$|^Resources/|^Vendor/|^runtime/|^extensions/|^scripts/|^\.github/workflows/ci\.yml$)'
          if git diff --name-only "$range" | grep -E "$patterns" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code-related paths changed."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code-related paths changed; heavy jobs will no-op."
          fi

  # Vendor/ThawUI declares swift-tools-version 6.4, so the build needs Xcode 27;
  # there is no Xcode 26 job as in Thaw.
  build:
    if: github.repository == 'thaw-app/Floe'
    # GitHub-hosted Xcode 27 preview image (arm64).
    runs-on: xcode-27
    needs: changes
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Skip macOS build (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed; skipping the build and checks."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      # Installs to ~/.bun/bin/bun, one of the places the Embed Runtime build
      # phase looks for the Bun it copies into the app.
      - name: Install Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # The Embed Runtime build phase fails without runtime/node_modules.
      - name: Install runtime dependencies
        if: needs.changes.outputs.code == 'true'
        working-directory: runtime
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Runtime smoke test
        if: needs.changes.outputs.code == 'true'
        run: bun runtime/smoke.ts extensions/hello planets

      - name: Cache SwiftPM
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # No test target yet, so this builds only. The selftest below is the
      # end-to-end check.
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Floe.xcodeproj \
            -scheme Floe \
            -configuration Debug \
            -derivedDataPath Build/ \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Swift to Bun round trip against the checkout's extensions/. A failed
      # command still exits 0, so the output is checked as well.
      - name: Selftest
        if: needs.changes.outputs.code == 'true'
        env:
          FLOE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          output="$(Build/Build/Products/Debug/Floe.app/Contents/MacOS/Floe --selftest hello planets)"
          echo "$output"
          grep -q '^SELFTEST OK' <<<"$output"

  sonarqube:
    needs: build
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-latest
    env:
      # Forks and Dependabot get no SONAR_TOKEN on pull_request.
      SONAR_ENABLED: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Skip SonarQube for fork / Dependabot PRs
        if: env.SONAR_ENABLED != 'true'
        run: |
          echo "Skipping SonarQube analysis (fork or Dependabot PR; no SONAR_TOKEN access)"
          echo "Analysis will be performed after merge to the default branch"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_ENABLED == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # No test target yet, so there is no coverage report to pass.
      - name: SonarQube Scan
        if: env.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

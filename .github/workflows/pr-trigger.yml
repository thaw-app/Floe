name: PR Command Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  trigger-build:
    # github/command logs the comment before it checks permissions, and the
    # runner reads workflow commands from that log, so outsiders never reach it.
    if: ${{ github.repository == 'thaw-app/Floe' && github.event.issue.pull_request && startsWith(github.event.comment.body, '.build') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-slim
    permissions:
      actions: write
      issues: write
      pull-requests: write

    steps:
      - uses: thaw-app/org-ci/actions/pr-build-command@cfa52194f39013d6f54e6f5a14dc57cec3a20e9b

sonar.projectKey=thaw-app_Floe
sonar.organization=thaw-app

# The name and version shown in SonarQube Cloud.
# Keep the version in sync with CFBundleShortVersionString in project.yml.
sonar.projectName=Floe
sonar.projectVersion=0.1.0

sonar.sources=Sources,runtime,scripts
sonar.tests=Tests,runtime,scripts/tests
sonar.test.inclusions=Tests/**,runtime/tests/**,runtime/smoke.ts,runtime/survey.ts,runtime/testing.ts,scripts/tests/**

# Vendor/ThawUI is an unmodified copy of Thaw's package and is analysed in Thaw's own project.
# extensions/ holds a sample and commands that fail on purpose to exercise the error screen.
# The runtime's tests and headless scripts are listed as tests above, so they leave the sources.
sonar.exclusions=\
  Vendor/**,extensions/**,**/node_modules/**,Floe.xcodeproj/**,\
  runtime/tests/**,runtime/smoke.ts,runtime/survey.ts,runtime/testing.ts,scripts/tests/**

# swift:S1075 (hard-coded URI) is off for Swift. What it flags here are fixed system locations
# (/usr/bin/git, /System/Applications), and defaults the user can replace in Settings (quicklinks, AI service addresses).
#
# swift:S1523 (dynamic code execution) is off for AppleScript.swift, the one place a script is run. Every
# caller passes a constant, or puts its values through AppleScript.literal, which escapes them.
#
# swift:S107 (parameter count) is off for Shell.swift: `run` keeps the signature it has in Droppy Code.
# It is off for Launcher/Model.swift too: every parameter of LauncherModel's init has a default that tests and the
# one-shot modes replace, and no caller passes more than two.
#
# swift:S1479 (switch case count) is off for RootItem.swift: RootItem has a case for each kind of row, and its id,
# title and kind switch over every one, so the compiler names a new kind's missing pieces.
sonar.issue.ignore.multicriteria=uri,script,shell,model,rows
sonar.issue.ignore.multicriteria.uri.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.uri.resourceKey=**/*.swift
sonar.issue.ignore.multicriteria.script.ruleKey=swift:S1523
sonar.issue.ignore.multicriteria.script.resourceKey=Sources/Floe/BuiltIn/AppleScript.swift
sonar.issue.ignore.multicriteria.shell.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.shell.resourceKey=Sources/Floe/DroppyCode/Shell.swift
sonar.issue.ignore.multicriteria.model.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.model.resourceKey=Sources/Floe/Launcher/Model.swift
sonar.issue.ignore.multicriteria.rows.ruleKey=swift:S1479
sonar.issue.ignore.multicriteria.rows.resourceKey=Sources/Floe/Launcher/RootItem.swift

# Coverage report paths are passed by CI (see ci.yml), because the reports exist only when a run
# built or restored them: coverage/swift.xml and coverage/runtime/lcov.info, from scripts/coverage.sh.

# Coverage exclusions.
#
# Rule (Thaw's): a file is excluded only when its substance cannot run in a unit test: SwiftUI
# view bodies, NSPanel and window wiring, the app entry point, Carbon hotkey registration,
# Accessibility and ScreenCaptureKit, the Keychain and login item, spawning the Bun process,
# and scanning the real Applications and extension folders.
#
# The logic those files used to hold lives in measured files with their own suites: Ranking,
# Manifest, ViewState, MarkdownParser, Shortcuts, PropFormat, Preferences, MenuBarLogic, Settings,
# Session, CommandLookup, UpdateLogic, SettingsSearchEntries, and under Thaw/: ThawHUDPlacement,
# UpdateChannel, Onboarding/OnboardingSequencer, Permissions/Permission and AppPermissions, and
# SettingsSearch (index, ranker, model, navigation). New decision logic belongs there, not in the
# excluded files.
#
#   Launcher/Model.swift    panel state wired to NSWorkspace, the pasteboard and key events, with the
#                           MenuBar, Clipboard, FileSearch, Setup and Keys extensions cut out of it
#   Launcher/Catalog.swift  Paths and scans of the real file system, plus the folder watcher
#   Extensions/Session+Process.swift  the Bun process and its pipes; message handling is in Session.swift,
#                                     and memory-limit decisions are in Session+Memory.swift, both measured
#   Settings/SystemStores.swift  Keychain, preference files in Application Support, login item
#   BuiltIn/MenuBarItems.swift  Accessibility walk and screen capture
#   Thaw/ThawHUD.swift      the HUD's NSPanel and its view; where it sits is in ThawHUDPlacement.swift
#   Thaw/FloeIntents.swift  App Intents glue the system calls; command matching is in CommandLookup.swift
#   Thaw/Onboarding/**      onboarding views; the step order is in OnboardingSequencer.swift, measured
#   Thaw/Permissions/       PermissionViews and PermissionsWindow only; Permission and AppPermissions are measured
#   Settings/AISettingsSection.swift  General's AI section, a view; the choice it edits is in HostRequest.swift, measured
#   PreferredApps/ClipboardSettingsSection.swift  the clipboard role's picker and General's Clipboard section, views;
#                           what they show is decided in ClipboardApp.swift, measured
#   Thaw/Updates.swift      Sparkle's updater and its delegates; the decisions are in UpdateLogic.swift
#                           and Thaw/UpdateChannel.swift, which are measured
#   Settings/ExtensionSettingsView.swift, Settings/ShellCommandsSettingsSection.swift  views cut out of SettingsView.swift;
#                           what they edit is in Settings.swift and ShellCommand.swift, measured
#   Settings/ pages         AppearanceSettingsPane, ExtensionStoreSettingsPage, QuicklinksSettingsPage,
#                           FallbacksSettingsPage (its choices are Fallback.swift's, measured), SnippetsSettingsPage and MenuBarCommandsSettingsSection are views; so are
#                           PreferredApps/PreferredAppsSettingsSection and AI/ExtensionAISource
#   Settings/CommandsSettingsView.swift, Settings/BuiltInCommandsSection.swift  the Commands page, views; the
#                           commands it lists come from CatalogStore and LauncherFeatures, measured
#   PreferredApps/ClipboardAppPicker.swift  the clipboard role's picker, a view; what it offers is decided
#                           in ClipboardApp.swift, measured
#   AI/AskAITranscript.swift, Launcher/MarkdownView.swift  views; what they draw is made in AskAIModel and
#                           MarkdownParser, measured
#   Settings/SettingsMode.swift, Settings/SettingsWindow.swift, App/LauncherSettingsLink.swift  the settings
#                           process, its window and the launcher's handle on it; the messages are in
#                           ProcessLink.swift and UpdatesLink.swift, measured
#   Sync/CloudKitSyncStore.swift  the system's sync engine and its delegate, which need a signed build and an account;
#                           what it decides is in CloudSyncMirror.swift and CloudSyncRecords.swift, measured
#   Launcher/RootIcon.swift  the row-icon view extracted unchanged from Views.swift
#   App/MainMenu.swift      the main menu, where AppKit looks up key equivalents
#   BuiltIn/TextExpander.swift  a keystroke tap, which needs Accessibility; matching is in Snippets.swift, measured
#   App/AutoFillOptOut.swift  replaces methods of a private AppKit class
#   App/SearchBench.swift   `--bench-search`, a timing run that ends the process
#   App/SearchCommand.swift `--search`, a real catalog scan that prints results and ends the process
#   App/ResidentBench.swift  the live memory run, which starts the real app and ends the process
#   BuiltIn/ClipboardPasteboard.swift  the system pasteboard and synthetic Command-V
#   BuiltIn/NoteDeskView.swift  the notes view; the listing, saving and conflicts are in NoteDeskModel and NoteDesk, measured
#   BuiltIn/NoteViews.swift, FloatingNoteView.swift, FloatingNoteWindow.swift  the notes' views and the Floating Note's
#                           panel; what they show and save is in NoteDeskModel, FloatingNoteModel and FloatingNoteStore, measured
#   BuiltIn/NoteLayoutManager.swift  draws bullets, boxes, rules and code grounds; where they go is marked by MarkdownStyling, measured
#   Launcher/SearchFieldBeamView.swift, SearchFieldBeamLayers.swift  the beam's view and its Core Animation layers; its
#                           colour sets are in SearchFieldBeam.swift, measured
#   App/LauncherWindow.swift  the launcher's window, its showing and hiding and the memory-pressure source
#   Thaw/ListStyle.swift, BuiltIn/MenuItemSearchView.swift, Extensions/FieldEditorViews.swift,
#   Settings/ApplicationSettingsView.swift, Settings/SettingsSidebarPaneList.swift  views; the arrow keys' stepping is in
#                           Thaw/ListStepping.swift, measured
#   Launcher/QuickLookPresenter.swift  the system's Quick Look panel and the responder calls it makes
#   runtime/host.ts         entry script: argv, stdin and process.exit at top level
#   scripts/**              shell and build helpers

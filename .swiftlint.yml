included:
  - Sources

excluded:
  - .build
  - build
  - Vendor
  - Tests

disabled_rules:
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - inclusive_language
  - large_tuple
  - line_length
  - opening_brace
  - todo

# The file, function, type and complexity limits are on, but the violations that
# predate them are grandfathered in .swiftlint.baseline, so only new ones warn.
# That file holds those rules only; every other rule still reports. Regenerate
# with `swiftlint lint --write-baseline .swiftlint.baseline` once the tree is
# otherwise clean.
baseline: .swiftlint.baseline

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - convenience_type
  - discouraged_object_literal
  - empty_count
  - fatal_error_message
  - file_header
  - force_unwrapping
  - implicitly_unwrapped_optional
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - period_spacing
  - unavailable_function
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

custom_rules:
  objc_dynamic:
    name: "@objc dynamic"
    message: "`dynamic` modifier should immediately follow `@objc` attribute"
    regex: '@objc\b(\(\w*\))?+\s*(\S+|\v+\S*)\s*\bdynamic'
    match_kinds: attribute.builtin
  prefer_spaces_over_tabs:
    name: Prefer Spaces Over Tabs
    message: "Indentation should use 4 spaces per indentation level instead of tabs"
    regex: ^\t

# Floe's own files carry Floe's copyright line. Files ported from Thaw or Droppy Code
# keep the original's line, followed by one for Floe's changes; Droppy Code's license
# also asks for its attribution line in each file.
file_header:
  required_pattern: |-
    //
    //  SWIFTLINT_CURRENT_FILENAME
    //  Project: (Floe|Thaw|Droppy Code|Barometer|Audio Priority Bar|CMD-Z)
    //
    //  Copyright \((Floe\) © 2026 René Jiménez|Thaw\) © 2026 Toni Förster|Droppy Code\) © 2026 Jordy Spruit\n//  Droppy Code by Jordy Spruit \(Droppy\), https://getdroppycode\.app|Barometer\) © 2026 mackid1993\n//  Barometer by mackid1993, https://github\.com/mackid1993/Barometer|Audio Priority Bar\) © 2024 tobi, © 2026 Camille Guillory\n//  Audio Priority Bar by Camille Guillory, https://github\.com/camguillory/Audio-Priority-Bar|CMD-Z\) © 2026 Toni Förster\n//  CMD-Z by Toni Förster, https://github\.com/stonerl/CMD-Z)

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

trailing_comma:
  mandatory_comma: true

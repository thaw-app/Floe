# XcodeGen spec. Regenerate Floe.xcodeproj after editing: xcodegen generate
name: Floe
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  ThawUI:
    path: Vendor/ThawUI
  ThawConcurrency:
    path: Vendor/ThawConcurrency
  # Keep in step with Package.swift and with sparkle-version in .github/workflows/release.yml.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Keep these six in step with Package.swift.
  swift-subprocess:
    url: https://github.com/swiftlang/swift-subprocess
    exactVersion: 1.0.0
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
  swift-algorithms:
    url: https://github.com/apple/swift-algorithms
    exactVersion: 1.2.1
  swift-async-algorithms:
    url: https://github.com/apple/swift-async-algorithms
    exactVersion: 1.1.3
  # Only swift-async-algorithms uses this. Held back because 1.7 does not build with the Xcode 27 beta.
  swift-collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.6.0
  FendCore:
    path: Vendor/FendCore

settings:
  base:
    # Keep these four in step with the settings in Package.swift. Approachable concurrency is
    # InferIsolatedConformances and NonisolatedNonsendingByDefault; the language mode has the rest.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # A build writes each localizable string it finds beside the object files; `scripts/sync-strings.sh`
    # merges those into Sources/Floe/Resources/Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  Floe:
    type: application
    platform: macOS
    sources:
      - path: Sources/Floe
      - path: Resources/AppIcon.icon
      - path: runtime
        type: folder
        buildPhase: none
        excludes: [node_modules]
      - path: scripts
        buildPhase: none
      - path: project.yml
        buildPhase: none
    dependencies:
      - package: ThawUI
      - package: ThawConcurrency
      - package: Sparkle
      - package: swift-subprocess
        product: Subprocess
      - package: swift-markdown
        product: Markdown
      - package: swift-argument-parser
        product: ArgumentParser
      - package: swift-algorithms
        product: Algorithms
      - package: swift-async-algorithms
        product: AsyncAlgorithms
      - package: FendCore
    postBuildScripts:
      - name: Embed Runtime
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Copies the extension host and its React dependencies into the app, plus Bun itself,
          # so the installed app runs without this checkout or a system Bun.
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/runtime"
          if [ ! -d "$SRCROOT/runtime/node_modules/react-reconciler" ]; then
            echo "error: runtime dependencies are missing; run 'bun install' in runtime/"
            exit 1
          fi
          mkdir -p "$DEST/bin"
          rsync -a --delete --exclude smoke.ts --exclude survey.ts --exclude testing.ts --exclude tests --exclude bunfig.toml --exclude bin "$SRCROOT/runtime/" "$DEST/"
          # rsync leaves excluded names alone, so drop test files an earlier build copied.
          rm -rf "$DEST/tests" "$DEST/bunfig.toml" "$DEST/testing.ts"
          BUN=""
          for candidate in "${BUN_PATH:-}" /opt/homebrew/bin/bun "$HOME/.bun/bin/bun" /usr/local/bin/bun; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then BUN=$(realpath "$candidate"); break; fi
          done
          if [ -n "$BUN" ]; then
            cmp -s "$BUN" "$DEST/bin/bun" || cp -f "$BUN" "$DEST/bin/bun"
          else
            echo "warning: Bun not found; the app will look for a system copy at runtime"
          fi
          # Stamp the commit into the built Info.plist for the About page; signing happens after this step.
          COMMIT=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "uncommitted")
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null | head -1)" ]; then COMMIT="$COMMIT-dirty"; fi
          /usr/libexec/PlistBuddy -c "Set :GitCommitSHA $COMMIT" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Floe
        # Floe's own line, then the Thaw organization's. Thaw's author is credited
        # in the Acknowledgements sheet, under Thaw.
        NSHumanReadableCopyright: |
          Copyright © 2026 René Jiménez et al.
          © 2026 Thaw-app
        # Every web link the app opens, so none is hard-coded in source.
        FloeLinks:
          repository: https://github.com/thaw-app/Floe
          thaw: https://github.com/thaw-app/Thaw
          droppyCode: https://gitlab.com/droppyformac1/droppy-code
          sponsor: https://github.com/sponsors/diazdesandi
          discord: https://discord.gg/KDfWjWDnR4
          translate: https://crowdin.com/project/floe
          raycastExtensions: https://github.com/raycast/extensions
          compactSlider: https://github.com/buh/CompactSlider
          bun: https://bun.sh
          react: https://react.dev
          sparkle: https://sparkle-project.org
          swiftSubprocess: https://github.com/swiftlang/swift-subprocess
          swiftMarkdown: https://github.com/swiftlang/swift-markdown
          swiftArgumentParser: https://github.com/apple/swift-argument-parser
          swiftCmark: https://github.com/swiftlang/swift-cmark
          swiftAlgorithms: https://github.com/apple/swift-algorithms
          swiftNumerics: https://github.com/apple/swift-numerics
          swiftAsyncAlgorithms: https://github.com/apple/swift-async-algorithms
          swiftCollections: https://github.com/apple/swift-collections
          swiftSystem: https://github.com/apple/swift-system
          fend: https://github.com/printfn/fend
          nucleo: https://github.com/helix-editor/nucleo
          ignore: https://github.com/BurntSushi/ripgrep/tree/master/crates/ignore
          rayon: https://github.com/rayon-rs/rayon
        # Filled in from git by the Embed Runtime step.
        GitCommitSHA: unknown
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        # Thaw answers Floe's appearance request by opening floe://thaw-appearance. IncomingURLRouter takes every floe:// link.
        CFBundleURLTypes:
          - CFBundleURLName: com.thaw.floe
            CFBundleURLSchemes: [floe]
        # AI.ask can be pointed at a model server on this Mac or the local network (Ollama, LM Studio),
        # which answers over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSAppleEventsUsageDescription: Floe uses AppleScript to read the Finder selection, to save a note in Notes, to list your open browser tabs and switch to one when you turn that on, to run system commands such as Empty Trash and Toggle Dark Mode, and to control playback in Music or Spotify.
        NSCalendarsFullAccessUsageDescription: Floe shows your upcoming events and meeting links when you search for them, and adds an event when you type event and a sentence in the search.
        NSCalendarsUsageDescription: Floe shows your upcoming events and meeting links when you search for them.
        NSContactsUsageDescription: Floe finds people in your Contacts when you type contact and a name in the search.
        NSRemindersFullAccessUsageDescription: Floe adds a reminder to Reminders when you type remind and a sentence in the search.
        NSHighResolutionCapable: true
        # Sparkle updates. The appcast is published to this repository's gh-pages branch by
        # .github/workflows/release.yml.
        SUFeedURL: https://thaw-app.github.io/Floe/appcast.xml
        # PLACEHOLDER removed: the EdDSA pair is generated (private half in the login keychain,
        # account "floe"; see "Releases and updates" in docs/DEVELOPMENT.md).
        SUPublicEDKey: "hEUA26fN0uTXfnilG4w6FP1zhtaEHVbS7TsUqGW8VsU="
    settings:
      base:
        PRODUCT_NAME: Floe
        PRODUCT_BUNDLE_IDENTIFIER: com.thaw.floe
        # Ad hoc ("Sign to Run Locally"); set a team here once the app needs stable permissions.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        # The runtime embed step reads the checkout and Homebrew's Bun.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Floe:
    build:
      targets:
        Floe: all
    run:
      config: Debug
      environmentVariables:
        - variable: FLOE_AUTORUN
          value: hacker-news/frontpage
          isEnabled: false
        - variable: FLOE_DEBUG
          value: "1"
          isEnabled: false
    archive:
      config: Release

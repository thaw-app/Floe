[package]
name = "fend-core-c"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
fend-core = "1.5.8"
ignore = "0.4"
nucleo-matcher = "0.3.1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`: the wrapper catches a panic at each entry point, and aborting would take the launcher with it.
